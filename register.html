<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SmileCare Dental</title>

    <meta name="description"
        content="Create your SmileCare Dental account to manage appointments and patient information with ease.">

    <meta name="author" content="SmileCare Dental">

    <link rel="shortcut icon" href="images/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page register-page">

    <main class="auth-shell register-bg">

        <div class="auth-tools" aria-label="Page controls">

            <button class="nav-icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"
                aria-pressed="false">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
            </button>

            <button class="nav-icon-btn" id="rtl-toggle" type="button" aria-label="Toggle RTL mode"
                aria-pressed="false">
                <i class="fa-solid fa-right-left" aria-hidden="true"></i>
            </button>

        </div>

        <section class="auth-card auth-card--wide" aria-labelledby="register-heading">

            <div class="auth-brand">
                <a href="index.html" aria-label="SmileCare Dental home">
                    <img src="images/logo.png" alt="SmileCare Dental">
                </a>
            </div>

            <h1 class="auth-heading" id="register-heading">Create Your Account</h1>

            <p class="auth-description">
                Set up your profile in seconds and start booking, tracking, and managing your dental care with a
                premium patient experience.
            </p>

            <form class="auth-form" action="#" method="post">

                <div class="auth-field">
                    <label class="auth-label" for="full-name">Full Name</label>
                    <input class="auth-input" type="text" id="full-name" name="fullName"
                        placeholder="Enter your full name" autocomplete="name" required>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="register-email">Email Address</label>
                    <input class="auth-input" type="email" id="register-email" name="email"
                        placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="phone-number">Phone Number</label>
                    <input class="auth-input" type="tel" id="phone-number" name="phoneNumber"
                        placeholder="Enter your phone number" autocomplete="tel" required>
                </div>

                <div class="auth-field auth-password">
                    <label class="auth-label" for="register-password">Password</label>
                    <div class="auth-password-wrap">
                        <input class="auth-input" type="password" id="register-password" name="password"
                            placeholder="Create a strong password" autocomplete="new-password" required>
                        <button class="auth-password-toggle" type="button" data-password-toggle
                            data-target="register-password" aria-label="Show password">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-field auth-password">
                    <label class="auth-label" for="confirm-password">Confirm Password</label>
                    <div class="auth-password-wrap">
                        <input class="auth-input" type="password" id="confirm-password" name="confirmPassword"
                            placeholder="Confirm your password" autocomplete="new-password" required>
                        <button class="auth-password-toggle" type="button" data-password-toggle
                            data-target="confirm-password" aria-label="Show password">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <label class="auth-check" for="terms-conditions">
                    <input type="checkbox" id="terms-conditions" name="terms" required>
                    <span>I agree to the Terms &amp; Conditions</span>
                </label>

                <button class="auth-submit" type="submit">Create Account</button>

            </form>

            <div class="auth-divider" aria-hidden="true">
                <span>Sign Up With</span>
            </div>

            <div class="auth-social" aria-label="Social sign up options">

                <a class="auth-social-btn google" href="#" aria-label="Sign up with Google">
                    <img src="images/google-logo.svg" alt="" aria-hidden="true">
                </a>

                <a class="auth-social-btn facebook" href="#" aria-label="Sign up with Facebook">
                    <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                </a>

                <a class="auth-social-btn apple" href="#" aria-label="Sign up with Apple">
                    <i class="fa-brands fa-apple" aria-hidden="true"></i>
                </a>

                <a class="auth-social-btn x" href="#" aria-label="Sign up with X">
                    <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
                </a>

            </div>

            <p class="auth-bottom">
                Already have an account? <a href="login.html">Login</a>
            </p>

        </section>

    </main>

    <script src="js/main.js"></script>

</body>

</html>
